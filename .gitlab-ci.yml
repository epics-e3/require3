---
variables:
  GIT_SUBMODULE_STRATEGY: "recursive"
  SETUP_PATH: ".ci-local:.ci"
  BASE_RECURSIVE: "NO"
  APT: "libreadline6-dev libncurses5-dev perl clang g++-mingw-w64-i686 g++-mingw-w64-x86-64 qemu-system-x86 re2c"
  CMP: "gcc"
  BGFC: "default"

include:
  - project: "ics-infrastructure/gitlab-ci-yml"
    file: "PreCommit.gitlab-ci.yml"

default:
  tags:
    - docker

stages:
  - check
  - build

shellcheck:
  image: pipelinecomponents/shellcheck:latest
  stage: check
  before_script:
    - shellcheck --version
  script:
    # anything ending on .*sh, should be shell script
    - |
      find . -name .git -type d -prune -o -name .ci -type d -prune -o -type f -name \*.\*sh -print0 |
      xargs -0 -P $(nproc) -r -n1 shellcheck --format=gcc -x
    # magic, any file with a valid shebang should be scanned aswell
    - |
      find . -name .git -type d -prune -o -name .ci -type d -prune -o -type f -regex '.*/[^.]*$' -print0 |
      xargs -0 -P $(nproc) -r -n1 sh -c 'FILE="$0"; if head -n1 "$FILE" |grep -q "^#\\! \?/.\+\(ba|d|k\)\?sh" ; then shellcheck "$FILE" --format=gcc -x ; else /bin/true ; fi '

shfmt:
  image: mvdan/shfmt:v3.2.0-alpine
  stage: check
  before_script:
    - shfmt -version
  script:
    - shfmt -i 2 -ci -d . # 2 spaces indent, indent switch-case statements, show diff (don't apply change)

.build:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential git python3 curl p7zip-full libevent-dev
    - python3 .ci/cue.py prepare
  script:
    - python3 .ci/cue.py build
    - python3 .ci/cue.py test
    - python3 .ci/cue.py test-results

gcc_default:
  extends: .build
  variables:
    BASE: "7.0"
    MODULES: "pvxs"
    PVXS: "1.4.0"
    PVXS_REPOOWNER: epics-base
    VV: "1"
