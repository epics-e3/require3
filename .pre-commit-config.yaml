repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1 # 4.2.0 drops python3.6 support
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v13.0.0
    hooks:
      - id: clang-format
